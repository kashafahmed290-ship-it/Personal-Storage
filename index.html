<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Cloud Vault with AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0f0f0f; --bg-secondary: #1a1a1a; --bg-tertiary: #242424;
            --surface: #2d2d2d; --surface-variant: #3a3a3a;
            --primary: #8ab4f8; --primary-hover: #aac7ff; --secondary: #c58af9;
            --error: #f28b82; --success: #81c995; --warning: #fdd663;
            --text-primary: #e8eaed; --text-secondary: #9aa0a6;
            --border: #3c4043; --shadow: rgba(0, 0, 0, 0.3); --overlay: rgba(0, 0, 0, 0.6);
        }
        [data-theme="light"] {
            --bg-primary: #f8f9fa; --bg-secondary: #ffffff; --bg-tertiary: #f1f3f4;
            --surface: #ffffff; --surface-variant: #e8eaed;
            --primary: #1a73e8; --primary-hover: #1557b0; --secondary: #8430ce;
            --error: #d93025; --success: #1e8e3e; --warning: #f9ab00;
            --text-primary: #202124; --text-secondary: #5f6368;
            --border: #dadce0; --shadow: rgba(0, 0, 0, 0.1); --overlay: rgba(0, 0, 0, 0.4);
        }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg-primary); color: var(--text-primary); overflow: hidden; height: 100vh; transition: 0.3s; }
        
        /* General Setup */
        .icon-btn { background: transparent; border: none; color: var(--text-secondary); padding: 0.6rem; cursor: pointer; border-radius: 50%; transition: 0.3s; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;}
        .icon-btn:hover { background: var(--bg-tertiary); color: var(--primary); }
        .btn-primary { width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn { padding: 0.6rem 1.2rem; background: var(--surface); border: 1px solid var(--border); color: var(--text-primary); border-radius: 8px; cursor: pointer; display: flex; gap: 0.5rem; }
        .btn.danger { background: var(--error); border-color: var(--error); color: white; }

        /* Login Screen */
        #loginScreen { position: fixed; inset: 0; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .login-container { background: var(--bg-secondary); padding: 3rem; border-radius: 24px; box-shadow: 0 8px 32px var(--shadow); text-align: center; width: 90%; max-width: 400px; }
        .input-group { position: relative; margin-bottom: 1.5rem; }
        .input-group input { width: 100%; padding: 1rem 1rem 1rem 3rem; background: var(--bg-tertiary); border: 2px solid var(--border); border-radius: 12px; color: var(--text-primary); }
        .input-group i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }

        /* App Layout */
        #appContainer { display: none; height: 100vh; flex-direction: column; }
        .header { background: var(--bg-secondary); padding: 1rem 1.5rem; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); z-index: 100; }
        .header-left, .header-right { display: flex; align-items: center; gap: 1rem; }
        .logo { font-size: 1.3rem; font-weight: bold; color: var(--primary); display: flex; gap: 0.5rem; }
        .search-bar { position: relative; margin-left: 2rem; }
        .search-bar input { padding: 0.7rem 1rem 0.7rem 2.8rem; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 24px; color: white; width: 300px; }
        
        .main-content { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 260px; background: var(--bg-secondary); border-right: 1px solid var(--border); padding: 1.5rem 1rem; overflow-y: auto; }
        .nav-section-title { font-size: 0.75rem; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 0.8rem; }
        .nav-item { display: flex; gap: 1rem; padding: 0.8rem 1rem; cursor: pointer; border-radius: 12px; }
        .nav-item.active { background: var(--primary); color: white; }
        .nav-item:hover:not(.active) { background: var(--bg-tertiary); }
        
        .content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .breadcrumb { padding: 1.5rem 2rem; background: var(--bg-secondary); border-bottom: 1px solid var(--border); }
        .toolbar { padding: 1rem 2rem; display: flex; justify-content: space-between; }
        .files-container { flex: 1; padding: 1.5rem 2rem; overflow-y: auto; }
        
        /* Files */
        .files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; }
        .files-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .file-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; text-align: center; position: relative; cursor: pointer; }
        .file-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .file-checkbox { position: absolute; top: 0.5rem; left: 0.5rem; width: 24px; height: 24px; border: 2px solid var(--border); border-radius: 6px; display: none; align-items: center; justify-content: center; }
        .file-card:hover .file-checkbox { display: flex; }
        .file-menu-btn { position: absolute; top: 0.5rem; right: 0.5rem; background: var(--bg-tertiary); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; }
        .file-icon-container { aspect-ratio: 1; background: var(--bg-tertiary); border-radius: 8px; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .file-icon { font-size: 3rem; }
        .file-name { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Modals & Menus */
        .modal { position: fixed; inset: 0; background: var(--overlay); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal-content { background: var(--bg-secondary); padding: 2rem; border-radius: 16px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 1rem; }
        
        .context-menu { position: fixed; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0; display: none; z-index: 3000; min-width: 180px; }
        .context-menu-item { padding: 0.7rem 1rem; cursor: pointer; display: flex; gap: 0.8rem; align-items: center; }
        .context-menu-item:hover { background: var(--bg-tertiary); color: var(--primary); }

        .ai-text { background: var(--bg-tertiary); padding: 1rem; border-radius: 8px; white-space: pre-wrap; line-height: 1.5; font-family: monospace; max-height: 50vh; overflow-y: auto; color: var(--primary); border: 1px solid var(--border); }
        .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: var(--surface); padding: 1rem 2rem; border-radius: 8px; display: none; z-index: 9999; border-left: 4px solid var(--success); }
    </style>
</head>
<body data-theme="dark">

    <div id="loginScreen">
        <div class="login-container">
            <i class="fas fa-shield-alt login-icon"></i>
            <h1>Personal Cloud Vault</h1>
            <p>Enter your password</p>
            <form id="loginForm">
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="passwordInput" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary">Unlock Vault</button>
            </form>
        </div>
    </div>

    <div id="appContainer">
        <div class="header">
            <div class="header-left">
                <div class="logo"><i class="fas fa-cloud-upload-alt"></i> Cloud Vault</div>
            </div>
            <div class="header-right">
                <button class="icon-btn" onclick="clearApiKey()" title="Reset AI Key"><i class="fas fa-key"></i></button>
                <button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
                <button class="icon-btn" id="lockBtn"><i class="fas fa-lock"></i></button>
            </div>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <button class="btn-primary" onclick="document.getElementById('fileInput').click()" style="margin-bottom: 2rem;"><i class="fas fa-plus"></i> Upload Files</button>
                <input type="file" id="fileInput" multiple style="display: none;">
                
                <div class="nav-section">
                    <div class="nav-item active" onclick="openFolder(null)"><i class="fas fa-home"></i> All Files</div>
                </div>
                
                <div class="nav-section">
                    <div class="nav-section-title">Folders</div>
                    <div id="foldersList"></div>
                    <button class="btn" onclick="document.getElementById('newFolderModal').style.display='flex'" style="width: 100%; margin-top: 1rem;"><i class="fas fa-folder-plus"></i> New Folder</button>
                </div>
            </div>

            <div class="content-area">
                <div class="breadcrumb" id="breadcrumb"><i class="fas fa-home"></i> Home</div>
                <div class="toolbar">
                    <button class="btn danger" id="deleteBtn" style="display: none;"><i class="fas fa-trash"></i> Delete Selected</button>
                </div>
                <div class="files-container" id="filesContainer"></div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal" id="newFolderModal">
        <div class="modal-content">
            <div class="modal-header"><h2>New Folder</h2> <button class="icon-btn" onclick="document.getElementById('newFolderModal').style.display='none'"><i class="fas fa-times"></i></button></div>
            <form id="newFolderForm">
                <input type="text" id="folderNameInput" style="width: 100%; padding: 0.8rem; background: var(--bg-tertiary); border: 1px solid var(--border); color: white; border-radius: 8px; margin-bottom: 1rem;" required>
                <button type="submit" class="btn-primary">Create</button>
            </form>
        </div>
    </div>

    <!-- AI Summarize Modal -->
    <div class="modal" id="aiModal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2><i class="fas fa-magic" style="color: var(--secondary);"></i> AI Summary</h2>
                <button class="icon-btn" onclick="document.getElementById('aiModal').style.display='none'"><i class="fas fa-times"></i></button>
            </div>
            <div id="aiContent" class="ai-text">Fetching AI summary...</div>
        </div>
    </div>

    <!-- Context Menu -->
    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" id="ctxOpen"><i class="fas fa-eye"></i> Open</div>
        <div class="context-menu-item" id="ctxSummarize" style="color: var(--secondary);"><i class="fas fa-magic"></i> Summarize with AI</div>
        <div class="context-menu-item" id="ctxDelete" style="color: var(--error);"><i class="fas fa-trash"></i> Delete</div>
    </div>

    <div class="toast" id="toast"><span id="toastMessage">Success</span></div>

    <script>
        let db, currentFolderId = null, allFiles = [], allFolders = [], contextItem = null;

        // Init DB
        const req = indexedDB.open('CloudVault', 1);
        req.onupgradeneeded = e => {
            db = e.target.result;
            db.createObjectStore('files', { keyPath: 'id', autoIncrement: true });
            db.createObjectStore('folders', { keyPath: 'id', autoIncrement: true });
            db.createObjectStore('settings', { keyPath: 'key' });
        };
        req.onsuccess = e => db = e.target.result;

        const dbOp = (store, mode, method, data = null) => new Promise((res, rej) => {
            const r = db.transaction([store], mode).objectStore(store)[method](data);
            r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        });

        // App Logic
        document.getElementById('loginForm').onsubmit = async e => {
            e.preventDefault();
            const pass = document.getElementById('passwordInput').value;
            const saved = await dbOp('settings', 'readonly', 'get', 'password');
            if (!saved) { await dbOp('settings', 'readwrite', 'put', {key:'password', value:pass}); unlock(); }
            else if (saved.value === pass) unlock();
            else alert('Wrong password');
        };

        function unlock() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            loadData();
        }

        async function loadData() {
            allFiles = await dbOp('files', 'readonly', 'getAll');
            allFolders = await dbOp('folders', 'readonly', 'getAll');
            renderUI();
        }

        document.getElementById('fileInput').onchange = async e => {
            for(let file of e.target.files) {
                await new Promise(res => {
                    let r = new FileReader();
                    r.onload = async ev => { await dbOp('files', 'readwrite', 'add', { name: file.name, type: file.type, data: ev.target.result, folderId: currentFolderId }); res(); };
                    r.readAsDataURL(file);
                });
            }
            loadData();
        };

        document.getElementById('newFolderForm').onsubmit = async e => {
            e.preventDefault();
            await dbOp('folders', 'readwrite', 'add', { name: document.getElementById('folderNameInput').value, parentId: currentFolderId });
            document.getElementById('newFolderModal').style.display = 'none';
            loadData();
        };

        function renderUI() {
            document.getElementById('foldersList').innerHTML = allFolders.filter(f => !f.parentId).map(f => `<div class="nav-item" onclick="openFolder(${f.id})"><i class="fas fa-folder"></i> ${f.name}</div>`).join('');
            
            let html = '<div class="files-grid">';
            allFolders.filter(f => f.parentId === currentFolderId).forEach(f => {
                html += `<div class="file-card" ondblclick="openFolder(${f.id})">
                    <button class="file-menu-btn" onclick="openMenu(event, 'folder', ${f.id})"><i class="fas fa-ellipsis-v"></i></button>
                    <div class="file-icon-container"><i class="fas fa-folder file-icon" style="color: #fbbc04;"></i></div>
                    <div class="file-name">${f.name}</div></div>`;
            });
            allFiles.filter(f => f.folderId === currentFolderId).forEach(f => {
                let icon = f.type.startsWith('image') ? `<img src="${f.data}" style="width:100%;height:100%;object-fit:cover;">` : `<i class="fas fa-file-alt file-icon" style="color: #4285f4;"></i>`;
                html += `<div class="file-card">
                    <button class="file-menu-btn" onclick="openMenu(event, 'file', ${f.id})"><i class="fas fa-ellipsis-v"></i></button>
                    <div class="file-icon-container">${icon}</div>
                    <div class="file-name">${f.name}</div></div>`;
            });
            document.getElementById('filesContainer').innerHTML = html + '</div>';
            
            let curr = allFolders.find(f => f.id === currentFolderId);
            document.getElementById('breadcrumb').innerHTML = `<i class="fas fa-home"></i> Home ` + (curr ? `> ${curr.name}` : '');
        }

        function openFolder(id) { currentFolderId = id; loadData(); }

        // Context Menu
        function openMenu(e, type, id) {
            e.stopPropagation();
            contextItem = { type, id };
            const m = document.getElementById('contextMenu');
            m.style.left = e.pageX + 'px'; m.style.top = e.pageY + 'px'; m.style.display = 'block';
            
            // Show AI Summarize ONLY for text files
            let file = allFiles.find(f => f.id === id);
            document.getElementById('ctxSummarize').style.display = (type === 'file' && file && file.type.includes('text')) ? 'flex' : 'none';
        }
        document.onclick = () => document.getElementById('contextMenu').style.display = 'none';

        document.getElementById('ctxDelete').onclick = async () => {
            await dbOp(contextItem.type + 's', 'readwrite', 'delete', contextItem.id); loadData();
        };

        // ----------------------------------------------------
        // OPENROUTER AI INTEGRATION LOGIC 
        // ----------------------------------------------------

        // Clear API Key function (in header)
        function clearApiKey() {
            localStorage.removeItem('openRouterApiKey');
            showToast('API Key Reset Successfully');
        }

        function showToast(msg) {
            document.getElementById('toastMessage').innerText = msg;
            document.getElementById('toast').style.display = 'block';
            setTimeout(() => document.getElementById('toast').style.display = 'none', 3000);
        }

        document.getElementById('ctxSummarize').onclick = async () => {
            const file = allFiles.find(f => f.id === contextItem.id);
            if (!file) return;

            // 1. Get or Prompt API Key
            let apiKey = localStorage.getItem('openRouterApiKey');
            if (!apiKey) {
                apiKey = prompt("Please enter your OpenRouter API Key to use AI features:");
                if (apiKey) localStorage.setItem('openRouterApiKey', apiKey);
                else return;
            }

            // 2. Decode Text File
            let textContent = "";
            try {
                let b64 = file.data.split(',')[1];
                textContent = decodeURIComponent(escape(atob(b64)));
            } catch(e) {
                alert("Could not read text from this file."); return;
            }

            // 3. Open Modal & Show Loading
            document.getElementById('aiModal').style.display = 'flex';
            document.getElementById('aiContent').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analyzing document... please wait.';

            // 4. API Call
            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-3.5-turbo", // You can change this to another model if needed
                        messages: [
                            { role: "system", content: "You are an AI assistant inside a Cloud Vault. Summarize the user's text document clearly and concisely using bullet points." },
                            { role: "user", content: "Summarize this file:\n\n" + textContent.substring(0, 4000) } // Limit to 4000 chars to avoid token limits
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);
                
                if (data.choices && data.choices.length > 0) {
                    document.getElementById('aiContent').textContent = data.choices[0].message.content;
                } else {
                    throw new Error("Invalid response from OpenRouter API.");
                }

            } catch (err) {
                document.getElementById('aiContent').innerHTML = `<span style="color:var(--error)">Error: ${err.message}</span><br><br><small>If it says Unauthorized, click the key icon at the top right to reset your API key.</small>`;
            }
        };

        // Theme Toggle
        document.getElementById('themeToggle').onclick = () => {
            document.body.dataset.theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
        };
    </script>
</body>
</html>
